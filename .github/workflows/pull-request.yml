name: Continuous Integration

on:
  pull_request:

jobs:
  check-dependabot:
    name: Check Dependabot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate dependabot.yml
        uses: marocchino/validate-dependabot@v3
        with:
          path: .github/dependabot.yml

  validate-data:
    name: Check if dataset was prepared
    runs-on: ubuntu-latest
    # The default DVC remote is s3://diwop-leichte-sprache/dvc, so this job needs
    # credentials that can read that bucket. It used to need none, because the remote was
    # the local data/s3-mock directory. These repository secrets must exist or the pull fails.
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'eu-central-1' }}
    steps:
      - uses: actions/checkout@v6
      - uses: iterative/setup-dvc@v3
      - name: Pull dataset from DVC
        run: dvc pull
      - name: Check if final dataset is up-to-date with raw data
        run: dvc status; dvc status -q # First for visibility, second to fail if invalid

  test-python:
    name: Test Python Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "src-train/pyproject.toml"
      - name: Run Pytest
        run: uv run --project src-train pytest tests/

  smoke-test-train:
    name: Training Container Environment Test
    runs-on: ubuntu-latest
    steps:
      - name: Free up GitHub runner disk space # otherwise the huge docker image cannot be loaded
        run: |
          echo "Freeing up disk space"
          docker system prune -af
          sudo time rm -rf /usr/share/dotnet
          sudo time rm -rf /usr/local/lib/android
          sudo time rm -rf /opt/ghc
          sudo time rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v6
      - name: Run Training Smoke Test in Docker
        run: |
          BASE_IMAGE=$(grep '^train_image:' README.md | awk '{print $2}' | tr -d '\r')
          echo "Booting $BASE_IMAGE for training smoke test..."
          
          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            --user root \
            --entrypoint bash \
            $BASE_IMAGE -c "
            echo 'Installing uv...'
            pip install uv
            
            echo 'Compiling utility and data prep blueprints...'
            uv pip install --system --no-cache src-train/
            
            echo 'Executing Version Integrity Smoke Test...'
            python tests/train_container_smoke_test.py
            "

  smoke-test-eval:
    name: Evaluation Container Environment Test
    runs-on: ubuntu-latest
    steps:
      - name: Free up GitHub runner disk space # otherwise the huge docker image cannot be loaded
        run: |
          echo "Freeing up disk space"
          docker system prune -af
          sudo time rm -rf /usr/share/dotnet
          sudo time rm -rf /usr/local/lib/android
          sudo time rm -rf /opt/ghc
          sudo time rm -rf /opt/hostedtoolcache
      - uses: actions/checkout@v6
      - name: Run evaluation Smoke Test in Docker
        run: |
          BASE_IMAGE=$(grep '^eval_image:' README.md | awk '{print $2}' | tr -d '\r')
          echo "Booting $BASE_IMAGE..."

          docker run --rm \
            -v ${{ github.workspace }}:/app \
            -w /app \
            --user root \
            --entrypoint bash \
            $BASE_IMAGE -c "
            echo 'Installing evaluation dependencies...'
            pip install --no-cache-dir boto3

            echo 'Executing SGLang Version Integrity Smoke Test...'
            python tests/eval_container_smoke_test.py
            "
